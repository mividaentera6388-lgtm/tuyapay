<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 315" width="100%" height="100%">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1E27"/>
      <stop offset="50%" stop-color="#D90411"/>
      <stop offset="100%" stop-color="#8B0007"/>
    </linearGradient>
    <linearGradient id="redShine" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.05)"/>
      <stop offset="45%" stop-color="rgba(255,255,255,0.2)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.15)"/>
    </linearGradient>
    <filter id="shadowR" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#8B0007" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="5" y="5" width="490" height="305" rx="20" fill="url(#redGrad)" filter="url(#shadowR)"/>
  <rect x="5" y="5" width="490" height="305" rx="20" fill="url(#redShine)"/>
  <rect x="5" y="5" width="490" height="305" rx="20" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.2"/>

  <!-- Rayas decorativas doradas / amarillas de Éxito -->
  <path d="M-20 60 Q 200 180, 520 80" fill="none" stroke="#FCEE21" stroke-width="3" opacity="0.6"/>
  <path d="M-20 80 Q 200 200, 520 100" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <path d="M-20 100 Q 200 220, 520 120" fill="none" stroke="#FCEE21" stroke-width="1.5" opacity="0.4"/>

  <!-- Logo Éxito / Tuya -->
  <g transform="translate(35, 30)">
    <rect width="70" height="28" rx="6" fill="#FCEE21"/>
    <text x="35" y="19" fill="#E20613" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="14" text-anchor="middle" letter-spacing="1">éxito</text>
    <text x="80" y="21" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="16" letter-spacing="1">tuya</text>
  </g>

  <!-- Badge PRO -->
  <text x="460" y="50" fill="#FCEE21" font-family="Arial, sans-serif" font-weight="900" font-size="14" text-anchor="end" letter-spacing="3">PRO</text>

  <!-- Chip Dorado -->
  <g transform="translate(40, 95)">
    <rect width="52" height="40" rx="6" fill="#F4D03F" stroke="#B7950B" stroke-width="1.2"/>
    <line x1="0" y1="20" x2="52" y2="20" stroke="#B7950B" stroke-width="1"/>
    <line x1="26" y1="0" x2="26" y2="40" stroke="#B7950B" stroke-width="1"/>
    <circle cx="26" cy="20" r="7" fill="#F4D03F" stroke="#B7950B" stroke-width="1"/>
    
    <path d="M70 12 A 10 10 0 0 1 70 28" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M76 7 A 17 17 0 0 1 76 33" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M82 2 A 24 24 0 0 1 82 38" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- Número de Tarjeta Simulado Blanco -->
  <text x="40" y="190" fill="#FFFFFF" font-family="'Courier New', monospace" font-weight="bold" font-size="22" letter-spacing="3">5102  ••••  ••••  1954</text>

  <!-- Titular y Fecha -->
  <g transform="translate(40, 240)">
    <text x="0" y="0" fill="#FFC4C7" font-family="Arial, sans-serif" font-size="8" font-weight="bold" letter-spacing="1">TITULAR</text>
    <text x="0" y="20" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="14" font-weight="bold" letter-spacing="1.5">CLIENTE ÉXITO</text>
  </g>

  <g transform="translate(240, 240)">
    <text x="0" y="0" fill="#FFC4C7" font-family="Arial, sans-serif" font-size="8" font-weight="bold" letter-spacing="1">VENCE</text>
    <text x="0" y="20" fill="#FFFFFF" font-family="'Courier New', monospace" font-size="13" font-weight="bold">05/31</text>
  </g>

  <!-- Logo Mastercard Oficial -->
  <g transform="translate(385, 225)">
    <circle cx="28" cy="28" r="24" fill="#FFFFFF" fill-opacity="0.9"/>
    <circle cx="58" cy="28" r="24" fill="#FCEE21" fill-opacity="0.9"/>
    <path d="M 43,11 A 24,24 0 0,1 43,45 A 24,24 0 0,1 43,11 Z" fill="#FF5F00"/>
    <text x="43" y="66" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="9" text-anchor="middle" letter-spacing="0.5">mastercard</text>
  </g>
</svg>
