<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 315" width="100%" height="100%">
  <defs>
    <linearGradient id="blackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F242A"/>
      <stop offset="40%" stop-color="#0E1116"/>
      <stop offset="100%" stop-color="#050709"/>
    </linearGradient>
    <linearGradient id="blackShine" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.01)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
    <filter id="shadowB" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Tarjeta Base -->
  <rect x="5" y="5" width="490" height="305" rx="20" fill="url(#blackGrad)" filter="url(#shadowB)"/>
  <rect x="5" y="5" width="490" height="305" rx="20" fill="url(#blackShine)"/>
  <rect x="5" y="5" width="490" height="305" rx="20" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.2"/>

  <!-- Líneas geométricas elegantes de fondo -->
  <path d="M-10 120 L 510 240" fill="none" stroke="rgba(212,175,55,0.18)" stroke-width="1"/>
  <path d="M-10 140 L 510 260" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Logo Tuya / Éxito -->
  <g transform="translate(35, 30)">
    <rect width="65" height="26" rx="5" fill="#E20613"/>
    <text x="32" y="18" fill="#FFF" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="13" text-anchor="middle" letter-spacing="1">éxito</text>
    <text x="75" y="20" fill="#E5E7EB" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="15" letter-spacing="1">tuya</text>
  </g>

  <!-- Badge BLACK -->
  <text x="460" y="50" fill="#D4AF37" font-family="Arial, sans-serif" font-weight="900" font-size="14" text-anchor="end" letter-spacing="4">BLACK</text>

  <!-- Chip Contactless & EMV Platino -->
  <g transform="translate(40, 95)">
    <rect width="52" height="40" rx="6" fill="#D1D5DB" stroke="#9CA3AF" stroke-width="1.2"/>
    <line x1="0" y1="20" x2="52" y2="20" stroke="#9CA3AF" stroke-width="1"/>
    <line x1="26" y1="0" x2="26" y2="40" stroke="#9CA3AF" stroke-width="1"/>
    <circle cx="26" cy="20" r="7" fill="#D1D5DB" stroke="#9CA3AF" stroke-width="1"/>
    
    <path d="M70 12 A 10 10 0 0 1 70 28" fill="none" stroke="#D1D5DB" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M76 7 A 17 17 0 0 1 76 33" fill="none" stroke="#D1D5DB" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M82 2 A 24 24 0 0 1 82 38" fill="none" stroke="#D1D5DB" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- Número de Tarjeta Simulado Platino -->
  <text x="40" y="190" fill="#F3F4F6" font-family="'Courier New', monospace" font-weight="bold" font-size="22" letter-spacing="3">5329  ••••  ••••  9012</text>

  <!-- Titular y Fecha -->
  <g transform="translate(40, 240)">
    <text x="0" y="0" fill="#9CA3AF" font-family="Arial, sans-serif" font-size="8" font-weight="bold" letter-spacing="1">TITULAR</text>
    <text x="0" y="20" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="14" font-weight="bold" letter-spacing="1.5">CLIENTE BLACK VIP</text>
  </g>

  <g transform="translate(240, 240)">
    <text x="0" y="0" fill="#9CA3AF" font-family="Arial, sans-serif" font-size="8" font-weight="bold" letter-spacing="1">VENCE</text>
    <text x="0" y="20" fill="#FFFFFF" font-family="'Courier New', monospace" font-size="13" font-weight="bold">09/30</text>
  </g>

  <!-- Logo Mastercard Oficial -->
  <g transform="translate(385, 225)">
    <circle cx="28" cy="28" r="24" fill="#EB001B"/>
    <circle cx="58" cy="28" r="24" fill="#F79E1B" fill-opacity="0.9"/>
    <path d="M 43,11 A 24,24 0 0,1 43,45 A 24,24 0 0,1 43,11 Z" fill="#FF5F00"/>
    <text x="43" y="66" fill="#F9FAFB" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="9" text-anchor="middle" letter-spacing="0.5">mastercard</text>
  </g>
</svg>
